<script>

const DEFAULT_JSON = "Data.json";
const DEFAULT_EXCEL = "Data.xlsx";
let XLSX_LOADER = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  if(XLSX_LOADER) return XLSX_LOADER;
  XLSX_LOADER=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=resolve;s.onerror=()=>reject(new Error("Excel reader could not load"));document.head.appendChild(s)});

}
async function loadOnlineData(){
  if(DATA) return true;
  try{
    const response=await fetch(DEFAULT_JSON,{cache:"no-cache"});
    if(!response.ok) throw new Error("Data.json not found");
    const payload=await response.json(); ONLINE_SNAPSHOT=JSON.stringify(payload); DATA=decodeWire(payload); UPDATED=payload.updated||"Online data: Data.json"; return true;
  }catch(jsonErr){console.warn("Optimized data load failed; trying Excel:",jsonErr.message)}
  try{
    await loadSheetJS();
    const response = await fetch(DEFAULT_EXCEL, {cache:"no-cache"});
    if(!response.ok) throw new Error("Data.xlsx not found");
    const buffer = await response.arrayBuffer();
    const wb = XLSX.read(buffer,{type:"array",cellDates:true});
    const missing=REQUIRED.filter(s=>!wb.SheetNames.includes(s));
    if(missing.length) throw new Error("Missing required sheet(s): "+missing.join(", "));
    const out={};
    REQUIRED.forEach(s=>out[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null,raw:true}));
    DATA=compactData(out);
    UPDATED="Online Excel: Data.xlsx";
    return true;
  }catch(err){
    console.warn("Automatic Excel load failed:",err.message);
    return false;
  }
}
function refreshStatus(message){

}
async function refreshHomeData(){
 if(REFRESH_BUSY)return;
 if(PENDING_EXCEL){refreshStatus("Showing uploaded Excel. Publish it to update online data.");return}
 REFRESH_BUSY=true;refreshStatus("Checking for new sales…");
 const previousData=DATA;
 try{
  const response=await fetch(DEFAULT_JSON+"?refresh="+Date.now(),{cache:"no-store"});

}

}
const money = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});

  const s=String(v).trim();

  // HTML mobile/desktop date input: YYYY-MM-DD
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));

function targetFor(entity,id,name){const key=entity+" TGT",idKey=entity+" ID",nameKey=entity+" Name",norm=v=>String(v??"").trim().toLocaleLowerCase();const matches=rows("TGT").filter(r=>id?norm(r[idKey])===norm(id):norm(name)&&norm(r[nameKey])===norm(name));const values=matches.map(r=>r[key]).filter(v=>v!==null&&v!==undefined&&v!=="").map(Number).filter(Number.isFinite);return values.length===1?values[0]:null}

function ensureDerivedFields(){

 (DATA.Delivery||[]).forEach(r=>{r.__DELIVERY_VALUE=columnValue(r,["IMS Value","IMS TK"])});
 (DATA.Order||[]).forEach(r=>{r.__ORDER_VALUE=columnValue(r,["Order TK"])});
 const map=new Map();
 (DATA.Delivery||[]).forEach(r=>{ const area=String(r.Area??"").trim(); const zsm=String(r.level2name??"").trim(); if(area&&zsm&&!map.has(area)) map.set(area,zsm); });

}

function currentMonthStats(sheet,dateKey,valueKey){
  const all=rows(sheet); const rd=rangeDates(all,dateKey); const max=rd.max;
  const month=max?max.getMonth():new Date().getMonth(), year=max?max.getFullYear():new Date().getFullYear();
  const todayRows=all.filter(r=>{let d=dateOnly(r[dateKey]);return d&&d.getTime()===max?.getTime()});
  const first=new Date(year,month,1), end=max||new Date();
  const working=[...Array(Math.floor((end-first)/86400000)+1)].map((_,i)=>new Date(year,month,1+i)).filter(d=>d<=end&&d.getDay()!==5&&d.getTime()!==end.getTime());
  const monthRows=all.filter(r=>{let d=dateOnly(r[dateKey]);return d&&d>=first&&d<=end&&d.getDay()!==5&&d.getTime()!==end.getTime()});
  return {total:sum(all,valueKey),today:sum(todayRows,valueKey),avg:working.length?sum(monthRows,valueKey)/working.length:0,days:working.length,date:max};
}
function homeAchievementMeter(primary,target){
 const ratio=target>0?primary/target:null,display=ratio===null?"—":(ratio*100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
 const point=(fraction,r)=>{const a=Math.PI*(1-fraction);return [120+r*Math.cos(a),120-r*Math.sin(a)]};
 const arc=(start,end)=>{const a=point(start,88),b=point(end,88);return `M ${a[0]} ${a[1]} A 88 88 0 0 1 ${b[0]} ${b[1]}`};
 const tip=point(Math.max(0,Math.min(1,ratio??0)),76);
 const bands=[[0,.25,"#880e20"],[.25,.45,"#c62828"],[.45,.60,"#e56722"],[.60,.70,"#eab635"],[.70,.85,"#329447"],[.85,1,"#075b2b"]];
 const meterColor=ratio===null?"#7b8797":ratio>=.7?"#075b2b":"#a9192d";
 return `<div class="card achievement-meter" role="meter" aria-label="Total Zone Primary Achievement" aria-valuemin="0" ${ratio===null?"":`aria-valuenow="${(ratio*100).toFixed(2)}"`} aria-valuetext="${esc(display)}"><div class="smalltitle">Total Zone Primary Achv.</div><svg class="meter-graphic" viewBox="0 0 240 145" aria-hidden="true">${bands.map(([start,end,color])=>`<path d="${arc(start,end)}" fill="none" stroke="${color}" stroke-width="42"/>`).join("")}<path d="M 116 120 L 124 120 L ${tip[0].toFixed(1)} ${tip[1].toFixed(1)} Z" fill="#414649"/></svg><div class="meter-percent" style="color:${meterColor}">${display}</div><div class="meter-detail">Primary: ${money(primary)} · Zone TGT: ${money(target)}</div></div>`;
}
function homeSalesTrend(){
 const byDate=new Map(),add=(sheet,dateKey,valueKey,kind)=>rows(sheet).forEach(r=>{const date=iso(dateOnly(r[dateKey]));if(!date)return;const point=byDate.get(date)||{date,primary:0,delivery:0};point[kind]+=Number(r[valueKey])||0;byDate.set(date,point)});
 add("Primary","Order Date","__PRIMARY_VALUE","primary");add("Delivery","orderdate","__DELIVERY_VALUE","delivery");
 const latest=[...byDate.keys()].sort().at(-1);if(!latest)return '<div class="card sales-trend">No dated sales found.</div>';
 const data=[...byDate.values()].filter(x=>x.date.slice(0,7)===latest.slice(0,7)).sort((a,b)=>a.date.localeCompare(b.date));
 const width=Math.max(680,data.length*52+66),left=42,right=width-20,top=32,bottom=190,max=Math.max(1,...data.flatMap(x=>[x.primary,x.delivery]));
 const x=i=>left+(right-left)*(data.length===1?.5:i/(data.length-1)),y=value=>bottom-Math.max(0,value)/max*(bottom-top);
 const short=value=>{
 const n=Math.abs(value);
 if(n>=10000000) return (value/10000000).toFixed(1)+" Cr";
 if(n>=100000) return (value/100000).toFixed(1)+" L";
 if(n>=1000) return (value/1000).toFixed(1)+" K";
 return money(value);
};

 const lines=series.map(s=>`<polyline points="${data.map((d,i)=>`${x(i)},${y(d[s.key])}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[s.key])}" r="4" fill="${s.color}"><title>${esc(d.date)} ${s.label}: ${money(d[s.key])}</title></circle><text x="${x(i)}" y="${Math.max(14,Math.min(212,y(d[s.key])+s.dy))}" fill="${s.color}" text-anchor="middle" font-size="10" font-weight="700">${short(d[s.key])}</text>`).join("")}`).join("");
 const ticks=[0,.5,1].map(f=>`<line x1="${left}" y1="${y(max*f)}" x2="${right}" y2="${y(max*f)}" stroke="#e5edf2"/><text x="${left-6}" y="${y(max*f)+4}" text-anchor="end" fill="#617895" font-size="10">${short(max*f)}</text>`).join("");
 const labels=data.map((d,i)=>`<text x="${x(i)}" y="232" text-anchor="middle" fill="#617895" font-size="10">${d.date.slice(8)}</text>`).join("");
 return `<div class="card sales-trend"><div class="smalltitle">Primary &amp; Delivery by Date — ${esc(new Date(Number(latest.slice(0,4)),Number(latest.slice(5,7))-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}))}</div><div class="trend-wrap"><svg width="${width}" viewBox="0 0 ${width} 245" role="img" aria-label="Daily Primary and Delivery values for ${esc(latest.slice(0,7))}">${ticks}${lines}${labels}</svg></div><div class="trend-legend"><span><i style="background:#103b52"></i>Primary</span><span><i style="background:#e12535"></i>Delivery</span></div><details style="margin-top:12px"><summary style="cursor:pointer;color:#58728e;font-size:13px">See exact daily values</summary><div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Date</th><th style="text-align:right">Primary</th><th style="text-align:right">Delivery</th></tr></thead><tbody>${data.map(d=>`<tr><td>${esc(d.date)}</td><td class="num">${money(d.primary)}</td><td class="num">${money(d.delivery)}</td></tr>`).join("")}</tbody></table></div></details></div>`;
}

function homePrimarySkuCategoryTotals(){
 const totals={ballpen:0,pencil:0,eraser:0,numbering:0};
 rows("Primary").forEach(r=>{
   const sku=String(r.SKU??"").trim().toLowerCase();
   const v=Math.max(0,Number(r["__PRIMARY_VALUE"])||0);
   if(!sku||!v)return;
   if(/\b(ball\s*pen|ballpen|ball-point|ball point)\b/i.test(sku)) totals.ballpen+=v;
   if(/\bpencil\b/i.test(sku)) totals.pencil+=v;
   if(/\beraser\b/i.test(sku)) totals.eraser+=v;
   if(/\b(numbering\s*machine|numbering)\b/i.test(sku)) totals.numbering+=v;
 });
 return totals;
}

function zoneAchievementChart(data,selected,entity="Zone"){

function inferGitHubRepo(){
 const host=location.hostname.toLowerCase(); if(!host.endsWith(".github.io"))return {owner:"",repo:""};

}
function bufferToBase64(buffer){
 const bytes=new Uint8Array(buffer), chunk=0x8000; let binary=""; for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk)); return btoa(binary);
}
async function ghRequest(url,token,options={}){

 const body=await response.json().catch(()=>({})); if(!response.ok)throw new Error(body.message||`GitHub request failed (${response.status})`); return body;
}
