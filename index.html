<script>
let DATA = window.__EMBEDDED_DATA__ || null;
let UPDATED = window.__EMBEDDED_UPDATED__ || null;
let PENDING_EXCEL = null;
let ACTIVE_SALES_UPDATE=null;
let ONLINE_SNAPSHOT="", REFRESH_BUSY=false, REFRESH_TIMER=null, REFRESH_STATUS="";
const REQUIRED = ["Primary","Delivery","Order","Stock","TGT"];
const DEFAULT_JSON = "Data.json";
const DEFAULT_EXCEL = "Data.xlsx";
let XLSX_LOADER = null;
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  if(XLSX_LOADER) return XLSX_LOADER;
  XLSX_LOADER=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";s.onload=resolve;s.onerror=()=>reject(new Error("Excel reader could not load"));document.head.appendChild(s)});
  return XLSX_LOADER;
}
async function loadOnlineData(){
  if(DATA) return true;
  try{
    const response=await fetch(DEFAULT_JSON,{cache:"no-cache"});
    if(!response.ok) throw new Error("Data.json not found");
    const payload=await response.json(); ONLINE_SNAPSHOT=JSON.stringify(payload); DATA=decodeWire(payload); UPDATED=payload.updated||"Online data: Data.json"; return true;
  }catch(jsonErr){console.warn("Optimized data load failed; trying Excel:",jsonErr.message)}
  try{
    await loadSheetJS();
    const response = await fetch(DEFAULT_EXCEL, {cache:"no-cache"});
    if(!response.ok) throw new Error("Data.xlsx not found");
    const buffer = await response.arrayBuffer();
    const wb = XLSX.read(buffer,{type:"array",cellDates:true});
    const missing=REQUIRED.filter(s=>!wb.SheetNames.includes(s));
    if(missing.length) throw new Error("Missing required sheet(s): "+missing.join(", "));
    const out={};
    REQUIRED.forEach(s=>out[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null,raw:true}));
    DATA=compactData(out);
    UPDATED="Online Excel: Data.xlsx";
    return true;
  }catch(err){
    console.warn("Automatic Excel load failed:",err.message);
    return false;
  }
}
function refreshStatus(message){
 REFRESH_STATUS=message;
 document.querySelectorAll(".sales-refresh-status").forEach(label=>label.textContent=message);
}
async function refreshHomeData(){
 if(REFRESH_BUSY)return;
 if(PENDING_EXCEL){refreshStatus("Showing uploaded Excel. Publish it to update online data.");return}
 REFRESH_BUSY=true;refreshStatus("Checking for new sales…");
 const previousData=DATA;
 try{
  const response=await fetch(DEFAULT_JSON+"?refresh="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Data unavailable");
  const payload=await response.json();
  if(!(payload&&((Array.isArray(payload.p)&&Array.isArray(payload.d))||(payload.data&&Array.isArray(payload.data.Primary)&&Array.isArray(payload.data.Delivery))||(Array.isArray(payload.Primary)&&Array.isArray(payload.Delivery)))))throw new Error("Invalid sales data");
  if(PENDING_EXCEL||DATA!==previousData)return;
  const snapshot=JSON.stringify(payload),changed=snapshot!==ONLINE_SNAPSHOT;
  if(changed){const next=decodeWire(payload);DATA=next;ONLINE_SNAPSHOT=snapshot;UPDATED=payload.updated||"Online data: Data.json";ensureDerivedFields()}
  REFRESH_STATUS="Last checked: "+new Date().toLocaleTimeString("en-US")+(changed?" · Sales updated":" · Up to date");
  if(changed){const page=(location.hash||"#home").slice(1);if(page==="home")render();else if(["zsm","asm"].includes(page)&&ACTIVE_SALES_UPDATE)ACTIVE_SALES_UPDATE();updateHomeOrderTicker()}
  refreshStatus(REFRESH_STATUS);
 }catch(error){refreshStatus("Update check failed. Showing last loaded data; retrying automatically.")}
 finally{REFRESH_BUSY=false}
}
function startHomeRefresh(){
 if(REFRESH_TIMER)return;
 const check=()=>{if(!document.hidden&&["#home","#zsm","#asm"].includes(location.hash||"#home"))refreshHomeData()};
 REFRESH_TIMER=setInterval(check,60000);
 document.addEventListener("visibilitychange",check);
 window.addEventListener("focus",check);
 window.addEventListener("hashchange",check);
 check();
}
const money = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const num = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
const dateOnly = v => {
  if(v===null || v===undefined || String(v).trim()==="") return null;
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),v.getDate());

  const s=String(v).trim();

  // HTML mobile/desktop date input: YYYY-MM-DD
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));

  // User/excel display format: DD/MM/YYYY
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));

  // Excel serial date
  if(/^\d{5}(?:\.\d+)?$/.test(s)){
    const serial=Number(s);
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);
    return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  }

  const d=new Date(s);
  return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
};
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : "";
const fmtDate = d => d ? d.toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}) : "";
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const val = (r,k) => r[k] ?? "";
function rows(sheet){return DATA?.[sheet] || []}
function zoneOf(r){const keys=Object.keys(r).filter(k=>/^Zone(?:_\d+)?$/.test(k)).reverse();for(const k of keys){const v=String(r[k]??"").trim();if(v)return v}return ""}
function columnValue(r,names){for(const name of names){if(Object.prototype.hasOwnProperty.call(r,name))return Number(r[name])||0;const key=Object.keys(r).find(k=>k.trim().toLowerCase()===name.toLowerCase());if(key)return Number(r[key])||0}return 0}
function columnText(r,names){for(const name of names){if(Object.prototype.hasOwnProperty.call(r,name)&&r[name]!==null&&r[name]!==undefined&&String(r[name]).trim()!=="")return String(r[name]).trim();const key=Object.keys(r).find(k=>k.trim().toLowerCase()===name.toLowerCase()&&r[k]!==null&&r[k]!==undefined&&String(r[k]).trim()!=="");if(key)return String(r[key]).trim()}return ""}
function entityId(r,entity){return columnText(r,[entity+" ID"]).toUpperCase()}
function entityKey(id,name){return id?"id:"+id:"name:"+name.trim().toLocaleLowerCase()}
function compactData(source){
 const base=(r,dateKey,valueHeader)=>{
   const x={};
   x[dateKey]=columnText(r,[dateKey]);
   x.SKU=columnText(r,["SKU"]);
   x.Area=columnText(r,["Area"]);
   x.Zone=columnText(r,["Zone"]);
   x[valueHeader]=columnValue(r,[valueHeader]);
   return x;
 };
 return {
  Primary:(source.Primary||[]).map(r=>{
    const x=base(r,"Order Date","DP Value");             /* AO = DP Value */
    x["SKU Code"]=columnText(r,["SKU Code"]);            /* BG = SKU Code */
    x["SKU Name"]=columnText(r,["SKU Name"]);            /* BH = SKU Name */
    x["DB ID"]=columnText(r,["DB ID"]).toUpperCase();
    x["DB Name"]=columnText(r,["DB Name"]);
    return x;
  }),
  Delivery:(source.Delivery||[]).map(r=>{
    const x=base(r,"orderdate","IMS TK");                 /* AE = IMS TK */
    x["IMS Value"]=x["IMS TK"];
    x["SKU Code"]=columnText(r,["SKU Code"]);             /* AQ = SKU Code */
    x["SKU Name"]=columnText(r,["SKU Name"]);             /* AR = SKU Name */
    x["DB ID"]=columnText(r,["DB ID","distributorcode"]).toUpperCase();
    x["DB Name"]=columnText(r,["DB Name"]);
    x["SO ID"]=columnText(r,["SO ID","srcode"]).toUpperCase();
    x["SO Name"]=columnText(r,["SO Name"]);
    return x;
  }),
  Order:(source.Order||[]).map(r=>{
    const x=base(r,"Order Date","Order TK");              /* U = Order TK */
    x["SKU Code"]=columnText(r,["SKU Code"]);             /* AD = SKU Code */
    x["SKU Name"]=columnText(r,["SKU Name"]);             /* AE = SKU Name */
    x["DB ID"]=columnText(r,["DB ID","Distributor Code"]).toUpperCase();
    x["DB Name"]=columnText(r,["DB Name"]);
    x["SO ID"]=columnText(r,["SO ID","SR Code"]).toUpperCase();
    x["SO Name"]=columnText(r,["SO Name"]);
    return x;
  }),
  Stock:(source.Stock||[]).map(r=>({
    "Total Value in DP":columnValue(r,["Total Value in DP"]),
    "Total Value in TP":columnValue(r,["Total Value in TP"]),
    "PCS per Carton":columnValue(r,["PCS per Carton"]),
    "SKU Code":columnText(r,["SKU Code"]),
    "SKU Name":columnText(r,["SKU Name"]),
    SKU:columnText(r,["SKU"])
  })),
  TGT:(source.TGT||[]).map(r=>({
    "SO Name":columnText(r,["SO Name"]),"SO ID":columnText(r,["SO ID"]).toUpperCase(),"SO TGT":columnText(r,["SO TGT"]),
    "DB Name":columnText(r,["DB Name"]),"DB ID":columnText(r,["DB ID"]).toUpperCase(),"DB TGT":columnText(r,["DB TGT"]),
    "Area Name":columnText(r,["Area Name","Area"]),"Area TGT":columnText(r,["Area TGT","ASM TGT"]),
    "Zone Name":columnText(r,["Zone Name","Zone"]),"Zone TGT":columnText(r,["Zone TGT","ZSM TGT"])
  }))
 };
}
function encodeWire(source){const d=compactData(source),pack=(r,dateKey,valueKey)=>[r[dateKey]??"",r[valueKey]||0,r.SKU??"",r.Area??"",r.Zone??"",r["DB ID"]??"",r["DB Name"]??"",r["SO ID"]??"",r["SO Name"]??"",r["SKU Code"]??"",r["SKU Name"]??""];return {v:6,p:d.Primary.map(r=>pack(r,"Order Date","DP Value")),d:d.Delivery.map(r=>pack(r,"orderdate","IMS Value")),o:d.Order.map(r=>pack(r,"Order Date","Order TK")),s:d.Stock.map(r=>[r["Total Value in DP"]||0,r["Total Value in TP"]||0,r["PCS per Carton"]||0,r["SKU Code"]||"",r["SKU Name"]||"",r.SKU||""]),t:d.TGT.map(r=>[r["SO Name"],r["SO ID"],r["SO TGT"],r["DB Name"],r["DB ID"],r["DB TGT"],r["Area Name"],r["Area TGT"],r["Zone Name"],r["Zone TGT"]])} }
function decodeWire(payload){if(!payload||!payload.v)return compactData(payload?.data||payload||{});if(payload.v===1)return compactData({Primary:(payload.p||[]).map(r=>({"Order Date":r[0],"DP Value":r[1],SKU:r[2],Area:r[3],Zone:r[4],"DB Name":r[5],"SO Name":r[6]})),Delivery:(payload.d||[]).map(r=>({orderdate:r[0],"IMS Value":r[1],SKU:r[2],Area:r[3],Zone:r[4],"DB Name":r[5],"SO Name":r[6]})),Order:(payload.o||[]).map(r=>({"Order Date":r[0],"Order TK":r[1],SKU:r[2],Area:r[3],Zone:r[4],"DB Name":r[5],"SO Name":r[6]}))});const unpack=(r,dateKey,valueKey)=>({[dateKey]:r[0],[valueKey]:r[1],SKU:r[2],Area:r[3],Zone:r[4],"DB ID":r[5],"DB Name":r[6],"SO ID":r[7],"SO Name":r[8],"SKU Code":r[9]??"","SKU Name":r[10]??""});return {Primary:(payload.p||[]).map(r=>unpack(r,"Order Date","DP Value")),Delivery:(payload.d||[]).map(r=>unpack(r,"orderdate","IMS Value")),Order:(payload.o||[]).map(r=>unpack(r,"Order Date","Order TK")),Stock:(payload.s||[]).map(r=>({"Total Value in DP":r[0]||0,"Total Value in TP":r[1]||0,"PCS per Carton":r[2]||0,"SKU Code":r[3]||"","SKU Name":r[4]||"",SKU:r[5]||""})),TGT:(payload.t||[]).map(r=>({"SO Name":r[0]||"","SO ID":r[1]||"","SO TGT":r[2],"DB Name":r[3]||"","DB ID":r[4]||"","DB TGT":r[5],"Area Name":r[6]||"","Area TGT":r[7],"Zone Name":r[8]||"","Zone TGT":r[9]}))}}
function targetFor(entity,id,name){const key=entity+" TGT",idKey=entity+" ID",nameKey=entity+" Name",norm=v=>String(v??"").trim().toLocaleLowerCase();const matches=rows("TGT").filter(r=>id?norm(r[idKey])===norm(id):norm(name)&&norm(r[nameKey])===norm(name));const values=matches.map(r=>r[key]).filter(v=>v!==null&&v!==undefined&&v!=="").map(Number).filter(Number.isFinite);return values.length===1?values[0]:null}
function targetCell(value){return value===null?"—":money(value)}
function achievement(value,target){return target===null||target<=0?"—":(100*value/target).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+"%"}
function sum(rows,key){return rows.reduce((a,r)=>a+(Number(r[key])||0),0)}
function uniq(arr){return [...new Set(arr.filter(x=>x!==null&&x!==undefined&&String(x).trim()!=="").map(String))].sort((a,b)=>a.localeCompare(b))}
const ZONE_ORDER=["DHKN","DHKS","CTG","NB","SB","COR","EC&SC"];
function compareZones(a,b){const rank=v=>{const i=ZONE_ORDER.indexOf(String(v).trim().toUpperCase());return i<0?ZONE_ORDER.length:i};return rank(a)-rank(b)||String(a).localeCompare(String(b))}
function zoneList(values){return uniq(values).sort(compareZones)}
function rangeDates(rows,key){let ds=rows.map(r=>dateOnly(r[key])).filter(Boolean);return {min:ds.length?new Date(Math.min(...ds)):null,max:ds.length?new Date(Math.max(...ds)):null}}
function detectedSheetDateRange(sheet,key){
  const r=rangeDates(rows(sheet),key);
  return {min:r.min,max:r.max};
}
function detectedCombinedDateRange(specs){
  const ranges=specs.map(s=>detectedSheetDateRange(s.sheet,s.date));
  const mins=ranges.map(r=>r.min).filter(Boolean);
  const maxs=ranges.map(r=>r.max).filter(Boolean);
  return {
    min:mins.length?new Date(Math.min(...mins.map(d=>d.getTime()))):null,
    max:maxs.length?new Date(Math.max(...maxs.map(d=>d.getTime()))):null
  };
}
const AREA_DISPLAY_ORDER=["Mirpur", "Gazipur", "Mohammadpur", "Savar", "Tangail", "Mymensing", "Chawk Bazar", "Jatrabari", "Badda", "Keranigonj", "Narayangonj", "Brahmanbaria", "Sylhet", "Chittagong", "Hathazari", "Cox's Bazar", "Noakhali", "Cumilla", "Rajshahi", "Bogura", "Pabna", "Rangpur", "Dinajpur", "Jossore", "Barishal", "Faridpur", "Madaripur", "Khulna", "Naim", "Samsuddoha", "Moin", "Hasan", "Ashequr", "Israt", "MIM", "Injamam"];
const AREA_ORDER_INDEX=new Map(AREA_DISPLAY_ORDER.map((x,i)=>[String(x).trim().toLowerCase(),i]));
function sortAreasInRequestedOrder(items,getName=x=>x){
 return [...items].sort((a,b)=>{
  const an=getName(a),bn=getName(b);
  const ai=AREA_ORDER_INDEX.get(String(an??"").trim().toLowerCase()),bi=AREA_ORDER_INDEX.get(String(bn??"").trim().toLowerCase());
  return (ai===undefined?9999:ai)-(bi===undefined?9999:bi)||String(an??"").localeCompare(String(bn??""));
 });
}
function positiveNum(v){const n=Number(v);return Number.isFinite(n)&&n>0?n:0}
function currentMonthRange(){
  const now=new Date();
  return {min:new Date(now.getFullYear(),now.getMonth(),1),max:new Date(now.getFullYear(),now.getMonth()+1,0)};
}
function currentMonthHalfRange(which){
  const r=currentMonthRange();
  if(which==="first") return {min:new Date(r.min.getFullYear(),r.min.getMonth(),1),max:new Date(r.min.getFullYear(),r.min.getMonth(),15)};
  const lastDay=r.max.getDate();

function setDateRangeInputs(from,to,range){
  from.value=iso(range.min);
  to.value=iso(range.max);
}
function filterRows(sheet,key,from,to,zone,area){
  return rows(sheet).filter(r=>{
    let d=dateOnly(r[key]); if(from&&(!d||d<from)) return false; if(to&&(!d||d>to)) return false;

    if(area && String(r.Area||"")!==String(area)) return false;

  });
}
function dateInput(value){return `<input type="date" value="${esc(value)}">`}
function options(list,selected=""){return `<option value="">Select ${selected==="__none__"?"":""}</option>`+list.map(x=>`<option ${String(x)===String(selected)?"selected":""} value="${esc(x)}">${esc(x)}</option>`).join("")}
function metric(label,value,sub="",cardClass=""){return `<div class="card metric ${esc(cardClass)}"><div class="label">${label}</div><div class="value">${money(value)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>`}

  let sorted=[...data].sort((a,b)=>(Number(b[valueKey])||0)-(Number(a[valueKey])||0)).slice(0,limit);

}
function grouped(rows,key,valueKey){
  const m=new Map(); rows.forEach(r=>{let k=String(r[key]??"").trim();if(!k)return;m.set(k,(m.get(k)||0)+(Number(r[valueKey])||0))});
  return [...m].map(([name,value])=>({name,value}));
}
function entityGroups(sourceRows,entity,valueKey){
 const m=new Map();sourceRows.forEach(r=>{const id=entityId(r,entity),name=columnText(r,[entity+" Name"]);if(!id&&!name)return;const key=entityKey(id,name);const item=m.get(key)||{id,name:name||id,value:0,rows:[]};if((!item.name||item.name===item.id)&&name)item.name=name;item.value+=Number(r[valueKey])||0;item.rows.push(r);m.set(key,item)});return [...m.values()].sort((a,b)=>b.value-a.value);
}
function primaryWithoutNegativeDB(sourceRows){const totals=new Map();sourceRows.forEach(r=>{const id=entityId(r,"DB"),name=columnText(r,["DB Name"]),key=id||name?entityKey(id,name):"unknown";totals.set(key,(totals.get(key)||0)+(Number(r.__PRIMARY_VALUE)||0))});return [...totals.values()].reduce((sum,value)=>sum+Math.max(0,value),0)}
function skuDrillHtml(sourceRows,valueKey,title){const data=grouped(sourceRows,"SKU",valueKey).sort((a,b)=>b.value-a.value);return `<div class="drill-panel"><div class="smalltitle">${esc(title)} — SKU Wise</div><div class="table-wrap"><table><thead><tr><th>SKU</th><th style="text-align:right">Value</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${money(x.value)}</td></tr>`).join("")}</tbody></table></div></div>`}
function skuNameDrillHtml(sourceRows,valueKey,sku,valueLabel){
 const m=new Map();
 sourceRows.filter(r=>String(r.SKU??"").trim()===String(sku??"").trim()).forEach(r=>{
   const name=String(r["SKU Name"]??"").trim();
   if(!name)return;

 const data=[...m.values()].map(x=>({...x,code:[...x.codes].join(", ")})).sort((a,b)=>b.value-a.value);

 return `<div class="drill-panel sku-name-drill">

function skuTickerData(sheet,dateKey,valueKey){
  if(!DATA)return {date:null,data:[]};
  ensureDerivedFields();
  const all=rows(sheet);
  if(!all.length)return {date:null,data:[]};

  // Match the SKU calculation used on the corresponding sales page.
  const today=dateOnly(new Date());
  let activeDate=today;
  let selected=filterRows(sheet,dateKey,today,today,"","");
  if(!selected.length){
    const latest=rangeDates(all,dateKey).max;
    if(latest){
      activeDate=latest;
      selected=filterRows(sheet,dateKey,latest,latest,"","");
    }
  }
  const data=grouped(selected,"SKU",valueKey)
    .filter(x=>String(x.name||"").trim()!=="")
    .sort((a,b)=>b.value-a.value);
  return {date:activeDate,data};
}

let tickerLabelAnimationFrame=0;
function syncTickerLiveLabel(){
  const bar=document.querySelector(".home-order-ticker");
  const viewport=bar?.querySelector(".ticker-viewport");
  const label=bar?.querySelector(".ticker-live");
  const sections=bar?[...bar.querySelectorAll(".ticker-section")]:[];
  if(bar&&viewport&&label&&sections.length){
    const vr=viewport.getBoundingClientRect();
    const probe=vr.left+8;
    let active=sections.find(section=>{
      const r=section.getBoundingClientRect();
      return r.right>probe && r.left<vr.right;
    });
    if(!active) active=sections[0];
    const next=active.dataset.tickerLabel||"Order";
    if(label.textContent!==next) label.textContent=next;
  }
  tickerLabelAnimationFrame=requestAnimationFrame(syncTickerLiveLabel);
}

function updateHomeOrderTicker(){
  const track=document.getElementById("homeTickerTrack");
  if(!track)return;
  try{
    // Primary, IMS and Order use the same SKU grouping/value calculation as their own pages.
    const order=skuTickerData("Order","Order Date","__ORDER_VALUE").data;
    const primary=skuTickerData("Primary","Order Date","__PRIMARY_VALUE").data;
    const ims=skuTickerData("Delivery","orderdate","__DELIVERY_VALUE").data;

    // Zone and Area percentages come directly from the same data functions used by Home charts.
    const zones=zoneAchievementData(null,null).filter(x=>Number.isFinite(Number(x.percent)));
    const areas=areaAchievementData(null,null).filter(x=>Number.isFinite(Number(x.percent)));

    track.innerHTML=
      tickerSectionHtml("Order",order,x=>money(x.value))+
      tickerSectionHtml("Primary",primary,x=>money(x.value))+
      tickerSectionHtml("IMS",ims,x=>money(x.value))+
      tickerSectionHtml("Zone",zones,x=>Number(x.percent).toFixed(2)+"%")+
      tickerSectionHtml("Area",areas,x=>Number(x.percent).toFixed(2)+"%");

    // Restart the 50s run whenever data refreshes so label/segment timing stays aligned.
    track.style.animation="none";
    void track.offsetWidth;

    const first=track.querySelector(".ticker-section");
    const live=document.getElementById("tickerLiveLabel");
    if(live)live.textContent=first?.dataset.tickerLabel||"Order";

  }catch(e){

 shell("Update data","Pick today's Excel file — publish it online, or download a ready index.html.",`
 <div class="card upload"><input id="file" type="file" accept=".xlsx,.xls,.xlsb"><div class="help">The file must contain the sheets <b>Primary</b>, <b>Delivery</b>, <b>Order</b> and <b>Stock</b>. Both .xlsx and .xlsb files are supported. The <b>XYZ</b> sheet is ignored because it is only a calculation/reference file.</div><div id="status" class="status${PENDING_EXCEL?' show':''}">${PENDING_EXCEL?`Ready to publish: ${esc(PENDING_EXCEL.name)} (${(PENDING_EXCEL.size/1048576).toFixed(1)} MB)`:''}</div>

 <div class="wide"><label>Fine-grained GitHub token (Contents: Read and write)</label><input id="gh-token" type="password" autocomplete="off" placeholder="github_pat_…"></div></div>

 <p class="security">Your token is used only for this publish request and is not saved in the page or browser storage.</p></div></div>`);
 const saved=JSON.parse(localStorage.getItem("salesVelocityGitHub")||"{}"); const inferred=inferGitHubRepo();
 document.getElementById("gh-owner").value=saved.owner||inferred.owner||""; document.getElementById("gh-repo").value=saved.repo||inferred.repo||""; document.getElementById("gh-branch").value=saved.branch||"main"; document.getElementById("gh-path").value=saved.path&&!/\.xlsx?$/i.test(saved.path)?saved.path:"Data.json";
 document.getElementById("file").onchange=handleFile;

async function handleFile(e){
 const file=e.target.files[0];if(!file)return; const status=document.getElementById("status");status.className="status show";status.textContent="Reading Primary, Delivery, Order, Stock and TGT sheets…";
 try{await loadSheetJS()}catch(err){status.className="status show error";status.textContent=err.message;return}
 const reader=new FileReader();reader.onload=ev=>{
  try{
   const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
   const missing=REQUIRED.filter(s=>!wb.SheetNames.includes(s));if(missing.length)throw new Error("Missing required sheet(s): "+missing.join(", "));
   const out={}; REQUIRED.forEach(s=>out[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null,raw:true}));
   DATA=compactData(out);PENDING_EXCEL=file;UPDATED=new Date().toLocaleString("en-US",{weekday:"long",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
   render(); const fresh=document.getElementById("status"); fresh.textContent=`Loaded successfully. ${out.Primary.length.toLocaleString()} Primary rows, ${out.Delivery.length.toLocaleString()} Delivery rows, ${out.Order.length.toLocaleString()} Order rows and ${out.Stock.length.toLocaleString()} Stock rows and ${out.TGT.length.toLocaleString()} target rows. Ready to publish.`;
  }catch(err){status.className="status show error";status.textContent=err.message}
 };reader.readAsArrayBuffer(file);
}
function inferGitHubRepo(){
 const host=location.hostname.toLowerCase(); if(!host.endsWith(".github.io"))return {owner:"",repo:""};
 const owner=host.slice(0,-10), first=location.pathname.split("/").filter(Boolean)[0]; return {owner,repo:first||owner+".github.io"};
}
function bufferToBase64(buffer){
 const bytes=new Uint8Array(buffer), chunk=0x8000; let binary=""; for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk)); return btoa(binary);
}
async function ghRequest(url,token,options={}){
 const response=await fetch(url,{...options,headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28",...(options.headers||{})}});
 const body=await response.json().catch(()=>({})); if(!response.ok)throw new Error(body.message||`GitHub request failed (${response.status})`); return body;
}
async function publishToGitHub(){
 if(!PENDING_EXCEL)return; const owner=document.getElementById("gh-owner").value.trim(),repo=document.getElementById("gh-repo").value.trim(),branch=document.getElementById("gh-branch").value.trim(),path=document.getElementById("gh-path").value.trim(),token=document.getElementById("gh-token").value.trim(),status=document.getElementById("status"),button=document.getElementById("publish");
 if(!owner||!repo||!branch||!path||!token){status.className="status show error";status.textContent="Complete all GitHub fields before publishing.";return}
 button.disabled=true; status.className="status show";
 try{
  localStorage.setItem("salesVelocityGitHub",JSON.stringify({owner,repo,branch,path})); status.textContent="Preparing optimized dashboard data…";
  const api=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, ref=await ghRequest(`${api}/git/ref/heads/${encodeURIComponent(branch)}`,token), parentSha=ref.object.sha;
  status.textContent="Uploading optimized data to GitHub…"; const json=JSON.stringify({updated:UPDATED,...encodeWire(DATA)}),content=bufferToBase64(new TextEncoder().encode(json).buffer); const blob=await ghRequest(`${api}/git/blobs`,token,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content,encoding:"base64"})});
  const parent=await ghRequest(`${api}/git/commits/${parentSha}`,token); const tree=await ghRequest(`${api}/git/trees`,token,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({base_tree:parent.tree.sha,tree:[{path,mode:"100644",type:"blob",sha:blob.sha}]})});
  const commit=await ghRequest(`${api}/git/commits`,token,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:`Update ${path} from Sales Velocity`,tree:tree.sha,parents:[parentSha]})});
  await ghRequest(`${api}/git/refs/heads/${encodeURIComponent(branch)}`,token,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({sha:commit.sha,force:false})});
  status.textContent="Published successfully. GitHub Pages may take a minute or two to show the update."; PENDING_EXCEL=null; document.getElementById("gh-token").value="";
 }catch(err){status.className="status show error";status.textContent="Publish failed: "+err.message}finally{button.disabled=!PENDING_EXCEL}
}
function downloadReady(){

 const injection=`<script>window.__EMBEDDED_DATA__=${JSON.stringify(DATA).replace(/<\//g,"<\\\\/")};window.__EMBEDDED_UPDATED__=${JSON.stringify(UPDATED)};<\/script>`;
 const ready=html.replace("</body>",injection+"</body>");
 const blob=new Blob(["<!doctype html>\n"+ready],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
